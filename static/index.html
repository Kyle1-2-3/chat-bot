<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- interactive-widget: shrink the layout when the keyboard opens so the
     sticky composer lands on top of it (Android Chrome pans instead by default) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark" />
<title>Brentwood Assistant</title>
<link rel="stylesheet" href="chat.css?v=20260929-events" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <button type="button" class="icon-btn" id="menuBtn" aria-label="Open sidebar" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <span class="topbar__name">Brentwood</span>
  </header>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Navigation and upcoming school events" inert>
    <div class="drawer__brand">
      <span class="drawer__title">Brentwood</span>
      <button type="button" class="icon-btn" id="closeDrawer" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button type="button" class="drawer-item is-active" id="navChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Chat</span>
    </button>
    <button type="button" class="drawer-item" id="navMap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21l-6-3V3l6 3 6-3 6 3v15l-6-3-6 3z"/><path d="M9 6v15"/><path d="M15 3v15"/></svg>
      <span>Campus map</span>
    </button>
    <div class="drawer-divider"></div>
    <section aria-labelledby="upcomingHeading">
      <h2 class="sidebar-heading" id="upcomingHeading">Upcoming events</h2>
      <div class="event-list" id="upcomingEvents" aria-live="polite">
        <p class="event-empty">Loading events…</p>
      </div>
    </section>
    <div class="drawer-footer">Brentwood College School</div>
  </aside>
  <div class="app">
    <!-- Thread -->
    <main class="thread-scroll" id="scroll">
      <div class="thread">
        <!-- Welcome -->
        <section class="hero" id="hero">
          <div class="brand-mark"><img src="brentwood-logo.svg" alt="Brentwood College School" /></div>
          <h1 class="hero__title">What can I help with?</h1>
          <div class="starter-grid" aria-label="Common questions">
            <button type="button" class="starter-card" data-prompt="What is for lunch today?">
              <span class="starter-card__icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M20 3c-4 1-5 5-5 9h5V3Zm0 9v9"/></svg>Food</span>
              <span class="starter-card__question">What’s for lunch today?</span>
            </button>
            <button type="button" class="starter-card" data-prompt="What is the block order today?">
              <span class="starter-card__icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h6"/></svg>Block order</span>
              <span class="starter-card__question">What’s my day looking like?</span>
            </button>
            <button type="button" class="starter-card" id="locationShortcut">
              <span class="starter-card__icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Location</span>
              <span class="starter-card__question">Find a place on campus</span>
            </button>
          </div>
        </section>

        <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
      </div>
    </main>

    <!-- Composer -->
    <div class="composer-dock">
      <form class="composer" id="form">
        <div class="composer__field">
          <label for="input" class="sr-only">Message Brentwood Assistant</label>
          <textarea id="input" rows="1" maxlength="500" placeholder="Ask anything about Brentwood" aria-describedby="counter"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
            </svg>
          </button>
        </div>
        <div class="composer__meta">
          <span class="composer__hint">Enter to send &middot; Shift+Enter for a new line</span>
          <span class="counter" id="counter" aria-live="off">0/500</span>
        </div>
      </form>
    </div>
  </div>

  <!-- Campus map view -->
  <section class="map-view" id="mapView" hidden aria-label="Campus map">
    <div class="map-head">
      <label for="mapSearch" class="sr-only">Search a building</label>
      <input id="mapSearch" type="search" placeholder="Search a building&hellip;" autocomplete="off" spellcheck="false" />
      <span class="map-status" id="mapStatus" aria-live="polite"></span>
    </div>
    <div class="map-stage">
      <div class="map-canvas">
        <img src="campus-map.png" alt="Brentwood College School campus map" draggable="false" />
        <div class="map-pin" id="mapPin" hidden>
          <span class="map-pin__dot"></span>
          <span class="map-pin__label" id="mapPinLabel"></span>
        </div>
      </div>
    </div>
  </section>

<script>
  // ============================================================
  // API: Flask serves @app.route("/chat", POST). Behind nginx that
  // proxies "/api", change to "/api/chat". POST {message,memory}->{reply}
  // ============================================================
  const API_ENDPOINT = "/chat";
  const MAX_CHARS = 500;
  const WARN_AT = 450;
  const REQUEST_TIMEOUT_MS = 18000;

  const conversation = []; // { role:"user"|"bot", text } — memory only, no localStorage

  const appEl     = document.querySelector(".app");
  const scrollEl  = document.getElementById("scroll");
  const heroEl    = document.getElementById("hero");
  const logEl     = document.getElementById("log");
  const formEl    = document.getElementById("form");
  const inputEl   = document.getElementById("input");
  const sendEl    = document.getElementById("send");
  const counterEl = document.getElementById("counter");
  const dockEl    = document.querySelector(".composer-dock");

  let inFlight = false;

  const ICON_COPY ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  const ICON_RETRY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';

  // ---------------- Composer behavior ----------------
  function autoGrow() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 132) + "px"; }
  function updateCounter() {
    const n = inputEl.value.length;
    counterEl.textContent = n + "/" + MAX_CHARS;
    counterEl.classList.toggle("is-warn", n >= WARN_AT);
  }
  function refreshSendState() { sendEl.disabled = inputEl.value.trim().length === 0 || inFlight; }

  inputEl.addEventListener("input", () => {
    if (inputEl.value.length > MAX_CHARS) inputEl.value = inputEl.value.slice(0, MAX_CHARS);
    autoGrow(); updateCounter(); refreshSendState();
  });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); formEl.requestSubmit(); }
  });
  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text || inFlight) return;
    sendMessage(text);
  });
  // ---------------- Rendering (textContent only for model output) ----------------
  function hideHero() { heroEl.classList.add("is-hidden"); appEl.classList.remove("app--welcome"); }
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollToBottom() {
    requestAnimationFrame(() => {
      scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: prefersReducedMotion ? "auto" : "smooth" });
    });
  }

  function appendUser(text) {
    const turn = document.createElement("div");
    turn.className = "turn turn--user";
    const bubble = document.createElement("div");
    bubble.className = "bubble bubble-user";
    bubble.textContent = text;
    turn.appendChild(bubble);
    logEl.appendChild(turn);
    scrollToBottom();
  }

  function makeBotTurn() {
    const turn = document.createElement("div");
    turn.className = "turn turn--bot";
    const col = document.createElement("div");
    col.className = "bot-col";
    const bubble = document.createElement("div");
    bubble.className = "bubble bubble-bot";
    col.appendChild(bubble);
    turn.appendChild(col);
    logEl.appendChild(turn);
    return { turn, bubble, col };
  }

  function showTyping(bubble) {
    const t = document.createElement("div");
    t.className = "typing"; t.setAttribute("role", "status");
    t.setAttribute("aria-label", "Brentwood Assistant is typing");
    t.innerHTML = "<span></span><span></span><span></span>";
    bubble.appendChild(t);
    scrollToBottom();
  }

  // Open menu/search links in a new tab so a student never loses the chat.
  if (window.DOMPurify) {
    DOMPurify.addHook("afterSanitizeAttributes", function (node) {
      if (node.tagName === "A" && node.getAttribute("href")) {
        node.setAttribute("target", "_blank");
        node.setAttribute("rel", "noopener noreferrer");
      }
    });
  }

  // Render an AI reply as sanitized markdown (bold, lists, etc.). Falls back
  // to plain text if a CDN lib is missing or anything throws.
  function renderRichText(el, text) {
    try {
      if (!window.marked || !window.DOMPurify) throw new Error("md libs unavailable");
      el.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
    } catch (e) {
      el.style.whiteSpace = "pre-wrap"; // preserve newlines without markdown
      el.textContent = text;
    }
  }

  function renderReply(bubble, col, text) {
    renderRichText(bubble, text); // sanitized markdown, falls back to plain text
    const actions = document.createElement("div");
    actions.className = "bot-actions";
    const copyBtn = document.createElement("button");
    copyBtn.type = "button"; copyBtn.className = "copy-btn";
    copyBtn.innerHTML = ICON_COPY + "<span>Copy</span>";
    copyBtn.addEventListener("click", () => {
      navigator.clipboard?.writeText(text).then(() => {
        const label = copyBtn.querySelector("span"); const prev = label.textContent;
        label.textContent = "Copied"; setTimeout(() => { label.textContent = prev; }, 1400);
      });
    });
    actions.appendChild(copyBtn);
    col.appendChild(actions);
    scrollToBottom();
  }

  function renderError(bubble, col, lastUserText) {
    bubble.textContent = "Sorry, I couldn’t reach the server. Please try again.";
    const retry = document.createElement("button");
    retry.type = "button"; retry.className = "retry";
    retry.innerHTML = ICON_RETRY + "<span>Try again</span>";
    retry.addEventListener("click", () => {
      if (inFlight) return;
      const turn = col.closest(".turn");
      if (turn) turn.remove();
      runRequest(lastUserText);
    });
    col.appendChild(retry);
    scrollToBottom();
  }

  // ---------------- Memory (turns prior to the in-flight message) ----------------
  const DEV_TRIGGER = "/천마리의새가우는소리";
  function buildMemory(userText = "") {
    const prior = conversation.slice(0, -1);
    // Dev raw-chat gets a deeper window (~10 Q&A pairs) than the normal 4 turns.
    const turns = userText.includes(DEV_TRIGGER) ? 20 : 4;
    return prior.slice(-turns)
      .map(t => (t.role === "user" ? "Student" : "Assistant") + ": " + t.text)
      .join("\n");
  }

  // ---------------- Send flow ----------------
  function sendMessage(text) {
    if (inFlight || !text.trim()) return;
    hideHero();
    appendUser(text);
    conversation.push({ role: "user", text });
    inputEl.value = ""; autoGrow(); updateCounter();
    runRequest(text);
  }

  async function runRequest(userText) {
    inFlight = true; refreshSendState();
    const { bubble, col } = makeBotTurn();
    showTyping(bubble);

    const memory = buildMemory(userText);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    try {
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userText, memory }),
        signal: controller.signal,
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const hasReply = !!(data && typeof data.reply === "string" && data.reply.trim());
      const reply = hasReply ? data.reply : "I’m sorry — I didn’t catch that. Could you try rephrasing?";
      renderReply(bubble, col, reply);
      if (hasReply) conversation.push({ role: "bot", text: reply });
    } catch (err) {
      clearTimeout(timer);
      renderError(bubble, col, userText);
    } finally {
      inFlight = false; refreshSendState();
    }
  }

  // iOS browsers (incl. iPhone Chrome — all WebKit) ignore interactive-widget
  // and pan the whole page when the keyboard opens. Feed the keyboard height
  // into --kb so the app shrinks to the visible area instead: the composer
  // rides the keyboard and the conversation stays put.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fitToViewport = () => {
      const inset = Math.max(0, Math.round(
        document.documentElement.clientHeight - vv.height - vv.offsetTop));
      document.documentElement.style.setProperty("--kb", inset + "px");
      if (window.scrollY) window.scrollTo(0, 0); // undo WebKit's focus pan
    };
    vv.addEventListener("resize", fitToViewport);
    vv.addEventListener("scroll", fitToViewport);
  }

  // Keep welcome centered as composer grows
  if (window.ResizeObserver && dockEl) {
    const ro = new ResizeObserver((entries) => {
      for (const e of entries) document.documentElement.style.setProperty("--dock-h", Math.round(e.contentRect.height) + "px");
    });
    ro.observe(dockEl);
  }

  // ---------------- Drawer view switching ----------------
  const menuBtn    = document.getElementById("menuBtn");
  const drawerEl   = document.getElementById("drawer");
  const scrimEl    = document.getElementById("scrim");
  const navChatBtn = document.getElementById("navChat");
  const navMapBtn  = document.getElementById("navMap");
  const mapViewEl  = document.getElementById("mapView");
  const closeDrawerBtn = document.getElementById("closeDrawer");
  const topbarEl = document.getElementById("topbar");

  function setDrawer(open) {
    drawerEl.inert = !open;
    appEl.inert = open;
    mapViewEl.inert = open;
    topbarEl.inert = open;
    drawerEl.classList.toggle("is-open", open);
    scrimEl.classList.toggle("is-open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    if (open) {
      closeDrawerBtn.focus();
      loadUpcomingEvents();
    } else {
      menuBtn.focus();
    }
  }
  menuBtn.addEventListener("click", () => setDrawer(!drawerEl.classList.contains("is-open")));
  closeDrawerBtn.addEventListener("click", () => setDrawer(false));
  scrimEl.addEventListener("click", () => setDrawer(false));
  document.addEventListener("keydown", (e) => {
    if (!drawerEl.classList.contains("is-open")) return;
    if (e.key === "Escape") setDrawer(false);
    if (e.key === "Tab") {
      const buttons = [...drawerEl.querySelectorAll("button:not(:disabled)")];
      const first = buttons[0], last = buttons[buttons.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function showView(view) {
    const isMap = view === "map";
    appEl.style.display = isMap ? "none" : "";
    if (mapViewEl) mapViewEl.hidden = !isMap;
    navChatBtn.classList.toggle("is-active", !isMap);
    navMapBtn.classList.toggle("is-active", isMap);
  }
  navChatBtn.addEventListener("click", () => { showView("chat"); setDrawer(false); });
  navMapBtn.addEventListener("click", () => { showView("map"); setDrawer(false); mapSearchEl.focus(); });
  document.getElementById("locationShortcut").addEventListener("click", () => {
    showView("map");
    mapSearchEl.focus();
  });

  // ---------------- Welcome shortcuts ----------------
  document.querySelectorAll(".starter-card[data-prompt]").forEach((card) => {
    card.addEventListener("click", () => sendMessage(card.dataset.prompt));
  });

  // ---------------- Public school-event sidebar ----------------
  const upcomingEventsEl = document.getElementById("upcomingEvents");
  const eventDateFormatter = new Intl.DateTimeFormat("en-CA", {
    weekday: "short", month: "short", day: "numeric", timeZone: "America/Vancouver"
  });
  function time12(value) {
    if (!value) return "";
    const [hour, minute] = value.split(":").map(Number);
    const suffix = hour >= 12 ? "PM" : "AM";
    return `${hour % 12 || 12}:${String(minute).padStart(2, "0")} ${suffix}`;
  }
  function eventDate(dateKey) {
    return eventDateFormatter.format(new Date(dateKey + "T12:00:00Z"));
  }
  function renderUpcomingEvents(events) {
    upcomingEventsEl.replaceChildren();
    if (!events.length) {
      const empty = document.createElement("p");
      empty.className = "event-empty";
      empty.textContent = "No upcoming events in the next two weeks.";
      upcomingEventsEl.appendChild(empty);
      return;
    }
    events.forEach((event) => {
      const row = document.createElement("article");
      row.className = event.is_special ? "event-card event-card--featured" : "event-card";
      const date = document.createElement("div");
      date.className = "event-date";
      const dateRange = event.end_date && event.end_date !== event.date
        ? `${eventDate(event.date)} – ${eventDate(event.end_date)}` : eventDate(event.date);
      date.textContent = `${event.is_special ? "Special event · " : ""}${dateRange}`;
      const detail = document.createElement("div");
      const title = document.createElement("div");
      title.className = "event-title";
      title.textContent = event.title;
      const time = document.createElement("div");
      time.className = "event-time";
      time.textContent = event.all_day ? "All day"
        : event.start_time && event.end_time ? `${time12(event.start_time)} – ${time12(event.end_time)}`
        : event.start_time ? `From ${time12(event.start_time)}` : "Time to be confirmed";
      detail.append(title, time);
      row.append(date, detail);
      upcomingEventsEl.appendChild(row);
    });
  }
  async function loadUpcomingEvents() {
    try {
      const response = await fetch("/api/upcoming-events", { headers: { "Accept": "application/json" } });
      if (!response.ok) throw new Error("event feed unavailable");
      const data = await response.json();
      renderUpcomingEvents(Array.isArray(data.events) ? data.events : []);
    } catch (_) {
      upcomingEventsEl.replaceChildren();
      const message = document.createElement("p");
      message.className = "event-empty";
      message.textContent = "Events are unavailable right now.";
      upcomingEventsEl.appendChild(message);
    }
  }
  loadUpcomingEvents();

  // ---------------- Campus map search ----------------
  // x/y are percentages of the map image (1536x1024).
  const BUILDINGS = [
    { name: "Crooks Hall", aliases: ["dining hall", "cafeteria", "student centre", "student center", "fitness centre", "fitness center", "tuck shop", "laundry"], x: 25.6, y: 77.0 },
    { name: "Campbell Common", aliases: ["common"], x: 32.7, y: 78.0 },
    { name: "Centre for Arts & Humanities", aliases: ["humanities", "arts and humanities"], x: 39.5, y: 78.5 },
    { name: "Centre for Innovation and Learning", aliases: ["innovation", "cfil"], x: 55.0, y: 77.5 },
    { name: "TGB Centre for Performing Arts", aliases: ["performing arts", "theatre", "theater", "tgb"], x: 29.3, y: 64.0 },
    { name: "Hope House", aliases: [], x: 28.6, y: 45.5 },
    { name: "Allard House", aliases: [], x: 35.2, y: 52.5 },
    { name: "Mackenzie House", aliases: [], x: 42.6, y: 55.5 },
    { name: "Alex House", aliases: [], x: 51.4, y: 62.8 },
    { name: "Rogers House", aliases: [], x: 55.5, y: 45.8 },
    { name: "Whittall House", aliases: [], x: 63.5, y: 53.0 },
    { name: "Ellis House", aliases: [], x: 72.4, y: 46.8 },
    { name: "Privett House", aliases: [], x: 70.0, y: 56.7 },
    { name: "Woodward", aliases: ["admin", "administration", "admissions"], x: 83.8, y: 45.3 },
    { name: "Maeda Health Centre", aliases: ["health", "nurse", "clinic", "maeda"], x: 79.0, y: 51.5 },
    { name: "Foote Athletic Centre", aliases: ["gym", "athletics", "foote"], x: 84.0, y: 16.5 },
    { name: "Artificial Turf", aliases: ["turf"], x: 85.3, y: 33.5 },
    { name: "Field 1", aliases: [], x: 23.4, y: 23.0 },
    { name: "Field 2", aliases: [], x: 37.8, y: 13.5 },
    { name: "Field 3 (Gillespie Field)", aliases: ["gillespie"], x: 56.6, y: 29.5 },
    { name: "Field 4", aliases: [], x: 69.5, y: 29.0 },
    { name: "Tennis Courts", aliases: ["tennis"], x: 38.3, y: 29.0 },
    { name: "Main Gate", aliases: ["gate", "entrance"], x: 48.0, y: 8.5 },
    { name: "Grounds", aliases: [], x: 62.3, y: 8.8 },
    { name: "Dock Area", aliases: ["dock", "waterfront", "pier"], x: 54.5, y: 93.5 },
    { name: "Visitor Parking", aliases: ["parking"], x: 21.0, y: 51.0 },
  ];

  const mapSearchEl = document.getElementById("mapSearch");
  const mapStatusEl = document.getElementById("mapStatus");
  const mapPinEl    = document.getElementById("mapPin");
  const mapPinLabel = document.getElementById("mapPinLabel");

  function findBuilding(query) {
    const q = query.trim().toLowerCase();
    if (q.length < 2) return null;
    return BUILDINGS.find(b =>
      b.name.toLowerCase().includes(q) ||
      b.aliases.some(a => a.includes(q) || q.includes(a))
    ) || null;
  }

  mapSearchEl.addEventListener("input", () => {
    const raw = mapSearchEl.value;
    if (!raw.trim()) {
      mapPinEl.hidden = true;
      mapStatusEl.textContent = "";
      mapStatusEl.classList.remove("is-error");
      return;
    }
    const hit = findBuilding(raw);
    if (hit) {
      mapPinEl.style.left = hit.x + "%";
      mapPinEl.style.top  = hit.y + "%";
      mapPinLabel.textContent = hit.name;
      mapPinEl.hidden = false;
      mapStatusEl.textContent = hit.name;
      mapStatusEl.classList.remove("is-error");
    } else {
      mapPinEl.hidden = true;
      mapStatusEl.textContent = "No matching building";
      mapStatusEl.classList.add("is-error");
    }
  });

  appEl.classList.add("app--welcome");
  updateCounter(); refreshSendState(); autoGrow();
</script>
